<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="em.css">
    <title>Em – Typography</title>
  </head>
  <body>
    <main>
      <h1>Typography</h1>
      <p>
        One face, two sizes, one leading. Running text is 13px on a 21px leading with 0.125px of tracking. Headings are 21px on the same leading, at the same weight.
      </p>
      <p>
        Text carries <a href="#"><u>links with a hairline underline</u></a>, <i>italics for asides</i> and figures such as <data value="1380">$1,380</data>. Paragraphs are one leading apart.
      </p>
      <p>
        <button type="button">A text button</button>
      </p>
    </main>
  </body>
</html>
