<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="em.css">
    <title>Em – Filters</title>
  </head>
  <body>
    <button popovertargetaction="show" popovertarget="filters">Filter & Sort</button>
    <dialog id="filters" popover>
      <header>
        <button popovertargetaction="hide" popovertarget="filters">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10.5 10.5" height="10.5" width="10.5" stroke="currentColor" fill="none">
            <polyline points="1,1 9.5,9.5"/>
            <polyline points="1,9.5 9.5,1"/>
          </svg>
        </button>
      </header>
      <nav>
        <details name="filters" open>
          <summary>Availability</summary>
          <ul>
            <li><label><input type="checkbox" name="availability">Available</label></li>
            <li><label><input type="checkbox" name="availability">Pre-order</label></li>
            <li><label><input type="checkbox" name="availability">Limited</label></li>
            <li><label><input type="checkbox" name="availability">Sold out</label></li>
          </ul>
        </details>
        <details name="filters">
          <summary>Category</summary>
          <ul>
            <li><label><input type="checkbox" name="material">Cotton</label></li>
            <li><label><input type="checkbox" name="material">Linen</label></li>
            <li><label><input type="checkbox" name="material">Silk</label></li>
          </ul>
        </details>
        <details name="filters">
          <summary>Designer</summary>
          <ul>
            <li><label><input type="checkbox" name="material">Cotton</label></li>
            <li><label><input type="checkbox" name="material">Linen</label></li>
            <li><label><input type="checkbox" name="material">Silk</label></li>
          </ul>
        </details>
        <details name="filters">
          <summary>Material</summary>
          <ul>
            <li><label><input type="checkbox" name="material">Merino</label></li>
            <li><label><input type="checkbox" name="material">Vicuña</label></li>
            <li><label><input type="checkbox" name="material">Cotton</label></li>
            <li><label><input type="checkbox" name="material">Linen</label></li>
            <li><label><input type="checkbox" name="material">Silk</label></li>
          </ul>
        </details>
        <details name="filters">
          <summary>Color</summary>
          <ul>
            <li><label><input type="checkbox" name="material">Cotton</label></li>
            <li><label><input type="checkbox" name="material">Linen</label></li>
            <li><label><input type="checkbox" name="material">Silk</label></li>
          </ul>
        </details>
        <details name="filters">
          <summary>Size</summary>
          <ul>
            <li><label><input type="checkbox" name="size">XS</label></li>
            <li><label><input type="checkbox" name="size">S</label></li>
            <li><label><input type="checkbox" name="size">M</label></li>
            <li><label><input type="checkbox" name="size">L</label></li>
            <li><label><input type="checkbox" name="size">XL</label></li>
          </ul>
        </details>
        <details name="filters">
          <summary>Sort</summary>
          <ul>
            <li><label><input type="radio" name="sort">Populatiry</label></li>
            <li><label><input type="radio" name="sort">Price</label></li>
            <li><label><input type="radio" name="sort">Date</label></li>
          </ul>
        </details>
      </nav>
      <footer>
        <button type="reset">
          Reset
        </button>
        <button type="submit">
          Submit
        </button>
      </footer>
    </dialog>
    <script>document.querySelector("dialog[popover]").showPopover()</script>
  </body>
</html>
