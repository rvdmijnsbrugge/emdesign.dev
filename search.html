<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="em.css">
    <title>Em – Search</title>
  </head>
  <body>
    <button popovertarget="search">Search</button>
    <dialog id="search" popover>
      <header>
        <form role="search">
          <input type="search" placeholder="Search"/>
          <button type="submit">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10.5 10.5" height="10.5" width="10.5" stroke="currentColor" fill="none">
              <circle r="4.25" cx="5.25" cy="5.25"/>
              <polyline points="9.5,9.5 8.5,8.5"/>
            </svg>
          </button>
        </form>
        <button popovertargetaction="hide" popovertarget="search">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10.5 10.5" height="10.5" width="10.5" stroke="currentColor" fill="none">
            <polyline points="1,1 9.5,9.5"/>
            <polyline points="1,9.5 9.5,1"/>
          </svg>
        </button>
      </header>
      <p>Popular</p>
      <menu>
        <li><button type="button">Wool gabardine trousers</button></li>
        <li><button type="button">Deerskin leather gloves</button></li>
        <li><button type="button">Linen muslin jackets</button></li>
        <li><button type="button">Cotton poplin shirts</button></li>
        <li><button type="button">Silk twill dresses</button></li>
      </menu>
      <output>
        <p>Trending</p>
        <ol>
          <li>
            <article>
              <a href="product">
                <figure></figure>
                Silk dress
              </a>
            </article>
          </li>
          <li>
            <article>
              <a href="product">
                <figure></figure>
                Cotton shirt
              </a>
            </article>
          </li>
          <li>
            <article>
              <a href="product">
                <figure></figure>
                Linen jacket
              </a>
            </article>
          </li>
          <li>
            <article>
              <a href="product">
                <figure></figure>
                Wool coat
              </a>
            </article>
          </li>
          <li>
            <article>
              <a href="product">
                <figure></figure>
                Vicuña sweater
              </a>
            </article>
          </li>
        </ol>
      </output>
    </dialog>
    <script>document.querySelector("dialog[popover]").showPopover()</script>
  </body>
</html>
