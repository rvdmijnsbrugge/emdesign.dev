<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="em.css">
    <title>Em – Product card</title>
  </head>
  <body>
    <article>
      <a href="product">
        <figure>
          <ol>
            <li>0</li>
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
            <li>5</li>
          </ol>
        </figure>
      </a>
      <header>
        <a href="product">
          Cotton Poplin Shirt
        </a>
        <data value="1380">
          $1,380
        </data>
      </header>
      <menu>
        <li><button disabled>XS</button></li>
        <li><button>S</button></li>
        <li><button>M</button></li>
        <li><button disabled>L</button></li>
        <li><button disabled>XL</button></li>
      </menu>
      <nav>
        <a href="product" class="active"></a>
        <a href="product"></a>
        <a href="product" aria-disabled="true"></a>
      </nav>
      <small>
        Pre-order
      </small>
      <button>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21 21" stroke="currentColor" fill="none" height="21" width="21">
          <polygon points="14,17.5 10.5,15.5 7,17.5 7,3.5 14,3.5 14,17.5"/>
        </svg>
      </button>
    </article>
  </body>
</html>
